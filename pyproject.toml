[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc-scrubber"
version = "0.1.0"
description = "Evidence-backed resume and cover-letter CLI using Codex or Claude Code"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scrubber = "scrubber.cli:main"

[tool.setuptools.packages.find]
include = ["scrubber*"]
